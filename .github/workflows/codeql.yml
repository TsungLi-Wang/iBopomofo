name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**/*.swift'
      - '**/*.cpp'
      - '**/*.mm'
      - '**/*.m'
      - '**/*.h'
      - '**/*.py'
      - '*.xcodeproj/**'
      - '*.xcworkspace/**'
      - '.github/workflows/codeql.yml'

  pull_request:
    branches: [ "master" ]
    paths:
      - '**/*.swift'
      - '**/*.cpp'
      - '**/*.mm'
      - '**/*.m'
      - '**/*.h'
      - '**/*.py'
      - '*.xcodeproj/**'
      - '*.xcworkspace/**'
      - '.github/workflows/codeql.yml'

  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'swift', 'cpp', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.language == 'python' && 'none' || 'manual' }}

    # whisper-server 不進 git（whisper-runtime/bin/）；iBopomofo target 的
    # 「Copy Whisper Runtime」build phase 需要它，缺了整個 build 就 exit 65，
    # CodeQL 的安全分析根本跑不到 —— 也就是「假紅燈」。
    # release.yml（7a05fd79）與 Build workflow（v2.17.1）都補過同一步，此處是第三個漏網的。
    # 只取 bin，不下載 574MB 模型。
    - name: Fetch whisper-server binary (not in git)
      if: matrix.language == 'swift' || matrix.language == 'cpp'
      run: WHISPER_FETCH_BIN_ONLY=1 ./whisper-runtime/fetch-runtime.sh

    - name: Build project
      if: matrix.language == 'swift' || matrix.language == 'cpp'
      run: |
        # 2026-08-12：scheme 已改名；舊 McBopomofoInstaller 會讓 CodeQL manual build 掛掉
        PYTHON=$(which python3) xcodebuild -scheme iBopomofoInstaller -configuration Debug build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
